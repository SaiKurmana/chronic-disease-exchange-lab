# Synthetic data — for demonstration only.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-app.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (FHIR validation, purpose filtering, audit, dedup, measures, site, app)
        run: python -m pytest
      - name: Small end-to-end simulation
        run: python -m tests.simulate_small

  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full pipeline (5,000 synthetic persons)
        run: make pipeline
      - name: Committed outputs and examples are reproducible
        run: git diff --stat --exit-code -- outputs examples
      - name: Build static site
        run: make site
