<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Flow A: Public Health bulk export sequence</title>
  <desc id="d">Sequence of messages between the health department, the broker and each node for a Public Health bulk export. Synthetic data — for demonstration only.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
  <rect width="980" height="520" fill="#fcfcfb"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0b0b0b">Flow A — Public Health (T-PH) population bulk export</text>
  <text x="24" y="54" font-size="12" fill="#52514e">Synthetic data — for demonstration only.</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="80" y="72" width="180" height="34" rx="6" fill="#e3f6ee" stroke="#1baf7a"/><text x="170" y="94" fill="#0b4d36">Health department</text>
    <rect x="400" y="72" width="180" height="34" rx="6" fill="#fdeee6" stroke="#eb6834"/><text x="490" y="94" fill="#7a2d0e">Broker</text>
    <rect x="720" y="72" width="180" height="34" rx="6" fill="#e8f1fc" stroke="#86b6ef"/><text x="810" y="94" fill="#0d366b">Node (×5)</text>
  </g>
  <g stroke="#c9c8c2" stroke-dasharray="4 4"><line x1="170" y1="106" x2="170" y2="490"/><line x1="490" y1="106" x2="490" y2="490"/><line x1="810" y1="106" x2="810" y2="490"/></g>
  <g font-size="12" fill="#0b0b0b" stroke-width="2">
    <line x1="170" y1="136" x2="486" y2="136" stroke="#52514e" marker-end="url(#a)"/><text x="180" y="130">POST /exchange/$export  {purpose T-PH, jurisdiction, date range, types}</text>
    <text x="500" y="164">authenticate · XP + role · jurisdiction · audit</text>
    <line x1="490" y1="190" x2="806" y2="190" stroke="#52514e" marker-end="url(#a)"/><text x="500" y="184">GET /Patient/$export  Prefer: respond-async</text>
    <line x1="806" y1="218" x2="494" y2="218" stroke="#52514e" marker-end="url(#a)"/><text x="560" y="212">202 Accepted · Content-Location</text>
    <line x1="490" y1="246" x2="806" y2="246" stroke="#52514e" marker-end="url(#a)"/><text x="500" y="240">GET status → 202 X-Progress, then 200 manifest</text>
    <line x1="490" y1="274" x2="806" y2="274" stroke="#52514e" marker-end="url(#a)"/><text x="500" y="268">GET files (NDJSON incl. PPRL tokens) · DELETE</text>
    <text x="500" y="302">minimum-necessary filter: drop names, MRNs, phone,</text>
    <text x="500" y="318">street; keep value-set codes in date range · audit</text>
    <line x1="486" y1="346" x2="174" y2="346" stroke="#52514e" marker-end="url(#a)"/><text x="190" y="340">202 Accepted · Content-Location (broker status)</text>
    <line x1="170" y1="374" x2="486" y2="374" stroke="#52514e" marker-end="url(#a)"/><text x="180" y="368">GET status → 200 manifest (per-node files)</text>
    <line x1="170" y1="402" x2="486" y2="402" stroke="#52514e" marker-end="url(#a)"/><text x="180" y="396">GET files → application/fhir+ndjson</text>
    <line x1="170" y1="430" x2="486" y2="430" stroke="#52514e" marker-end="url(#a)"/><text x="180" y="424">DELETE status → outbox purged (no persistence)</text>
    <text x="24" y="470" fill="#52514e">Then, at the health department: normalize → map codes/units → PPRL linkage → measures (DuckDB).</text>
  </g>
</svg>
