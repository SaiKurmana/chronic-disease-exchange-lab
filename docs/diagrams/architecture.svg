<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Chronic Disease Data Exchange Lab architecture</title>
  <desc id="d">Five simulated organization nodes expose FHIR APIs and bulk export; a simulated broker authenticates requesters, checks exchange purpose, applies a minimum-necessary filter and audits; the public health agency normalizes, maps codes, links records and computes measures. Synthetic data — for demonstration only.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <rect width="980" height="560" fill="#fcfcfb"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0b0b0b">Architecture (simulation)</text>
  <text x="24" y="54" font-size="12" fill="#52514e">Synthetic data — for demonstration only. Not a TEFCA implementation.</text>

  <!-- Organizations -->
  <rect x="24" y="76" width="250" height="392" rx="10" fill="#e8f1fc" stroke="#86b6ef"/>
  <text x="40" y="100" font-size="14" font-weight="700" fill="#0d366b">Healthcare organization nodes</text>
  <g font-size="12" fill="#0b0b0b">
    <rect x="40" y="114" width="218" height="52" rx="6" fill="#fff" stroke="#9ec5f4"/>
    <text x="52" y="134" font-weight="600">AMC · academic medical center</text><text x="52" y="152" fill="#52514e">SNOMED + ICD-10-CM, BP panel</text>
    <rect x="40" y="172" width="218" height="52" rx="6" fill="#fff" stroke="#9ec5f4"/>
    <text x="52" y="192" font-weight="600">RHC · rural health clinic</text><text x="52" y="210" fill="#52514e">local dx codes, split BP, batches</text>
    <rect x="40" y="230" width="218" height="52" rx="6" fill="#fff" stroke="#9ec5f4"/>
    <text x="52" y="250" font-weight="600">FQHC · community health center</text><text x="52" y="268" fill="#52514e">ICD-10-CM only, HbA1c mmol/mol</text>
    <rect x="40" y="288" width="218" height="52" rx="6" fill="#fff" stroke="#9ec5f4"/>
    <text x="52" y="308" font-weight="600">IPP · independent practice</text><text x="52" y="326" fill="#52514e">"mmHg" units, free-text meds</text>
    <rect x="40" y="346" width="218" height="52" rx="6" fill="#fff" stroke="#9ec5f4"/>
    <text x="52" y="366" font-weight="600">MMG · multispecialty group</text><text x="52" y="384" fill="#52514e">SNOMED only, duplicate resends</text>
    <text x="40" y="424" fill="#0d366b">Each node: FHIR R4 search API +</text>
    <text x="40" y="442" fill="#0d366b">Bulk Data-style $export (NDJSON),</text>
    <text x="40" y="460" fill="#0d366b">PPRL tokens computed at the source</text>
  </g>

  <!-- Broker -->
  <rect x="356" y="120" width="250" height="300" rx="10" fill="#fdeee6" stroke="#eb6834"/>
  <text x="372" y="146" font-size="14" font-weight="700" fill="#7a2d0e">Simulated network broker</text>
  <g font-size="12" fill="#0b0b0b">
    <text x="372" y="174">1 Authenticate requester (demo credential)</text>
    <text x="372" y="200">2 Check XP code + requester role</text>
    <text x="372" y="226">3 Check jurisdiction, date range, types</text>
    <text x="372" y="252">4 Route to nodes with network token</text>
    <text x="372" y="278">5 Minimum-necessary filter (T-PH):</text>
    <text x="386" y="296" fill="#52514e">limited data set, value sets, dates</text>
    <text x="372" y="322">6 Relay results; purge outbox</text>
    <text x="372" y="348">7 Append-only, hash-chained audit</text>
    <text x="386" y="366" fill="#52514e">who · purpose · what · when · outcome</text>
    <text x="372" y="400" fill="#7a2d0e">Deny by default → OperationOutcome</text>
  </g>

  <!-- Requesters -->
  <rect x="690" y="76" width="266" height="116" rx="10" fill="#e3f6ee" stroke="#1baf7a"/>
  <text x="706" y="100" font-size="14" font-weight="700" fill="#0b4d36">Requesters</text>
  <g font-size="12" fill="#0b0b0b">
    <text x="706" y="124">Health department (PHA)</text><text x="706" y="140" fill="#52514e">T-PH · population bulk export</text>
    <text x="706" y="164">Clinician (health care provider)</text><text x="706" y="180" fill="#52514e">T-TREAT · patient-level query</text>
  </g>

  <!-- PHA analytics -->
  <rect x="690" y="214" width="266" height="254" rx="10" fill="#f1f0ec" stroke="#a3a29b"/>
  <text x="706" y="238" font-size="14" font-weight="700" fill="#0b0b0b">PHA analytics (DuckDB)</text>
  <g font-size="12" fill="#0b0b0b">
    <text x="706" y="264">Normalize to US Core 6.1.0 / USCDI v3</text>
    <text x="706" y="290">Map local codes, units (IFCC→NGSP)</text>
    <text x="706" y="316">Link records with PPRL tokens</text>
    <text x="706" y="342">Measures: prevalence, CMS165-, CMS122-</text>
    <text x="706" y="358">adapted; strata; data quality</text>
    <text x="706" y="384">outputs/ → Streamlit app + static site</text>
    <text x="706" y="410" fill="#52514e">Ground truth kept separately; used</text>
    <text x="706" y="426" fill="#52514e">only to evaluate dedup accuracy</text>
  </g>

  <!-- arrows -->
  <line x1="606" y1="200" x2="688" y2="150" stroke="#52514e" stroke-width="2" marker-start="url(#a)"/>
  <line x1="606" y1="300" x2="688" y2="300" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <text x="614" y="292" font-size="11" fill="#52514e">filtered</text>
  <text x="614" y="318" font-size="11" fill="#52514e">NDJSON</text>
  <line x1="276" y1="200" x2="354" y2="200" stroke="#52514e" stroke-width="2" marker-start="url(#a)"/>
  <line x1="276" y1="300" x2="354" y2="300" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <text x="284" y="192" font-size="11" fill="#52514e">requests</text>
  <text x="284" y="318" font-size="11" fill="#52514e">FHIR data</text>

  <text x="24" y="510" font-size="12" fill="#52514e">One in-process broker stands in for QHINs, record locator and directory services, UDAP/SMART security and responder policy engines.</text>
  <text x="24" y="530" font-size="12" fill="#52514e">See docs/architecture.md, "How this simplifies real exchange".</text>
</svg>
